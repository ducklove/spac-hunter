name: Deploy GitHub Pages

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      refresh_data:
        description: Refresh data before deploying
        required: false
        default: true
        type: boolean
  schedule:
    # 18:10 KST daily.
    - cron: "10 9 * * *"

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install data dependencies
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Refresh SPAC data
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data)
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python fetch_data.py --history-pages 12 --merger-history-pages 60
      - name: Validate refreshed data
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data)
        run: python validate_data.py
      - name: Commit refreshed data
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data)
        run: |
          if git diff --quiet -- data.js current.json && [ -z "$(git status --porcelain -- alerts.json alerts.xml archive.json filings.json)" ]; then
            echo "No data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data.js current.json
          for file in alerts.json alerts.xml archive.json filings.json; do
            if [ -f "$file" ]; then
              git add -- "$file"
            fi
          done
          git commit -m "Update SPAC data"
          git push origin HEAD:main
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report scheduled refresh failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[data-refresh] 자동 데이터 갱신 실패";
            const runUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: [
                  "스케줄 데이터 갱신이 다시 실패했습니다.",
                  "",
                  `- 실패한 실행: ${runUrl}`,
                ].join("\n"),
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: [
                "매일 18:10 KST 자동 데이터 갱신(pages.yml)이 실패했습니다.",
                "",
                `- 실패한 실행: ${runUrl}`,
                "",
                "점검 항목:",
                "- [ ] 실행 로그에서 실패한 스텝 확인 (수집 실패 exit 1 / 안전 가드 거부 exit 2 / validate_data.py 검증 실패)",
                "- [ ] KRX·KIND·DART·네이버 등 데이터 소스 응답 상태 확인",
                "- [ ] 종목 수 급감이나 시세 수집률 저하가 실제 시장 변화인지 확인 (의도된 축소라면 `--force` 재실행 검토)",
                "- [ ] 로컬에서 `python fetch_data.py --history-pages 3` 후 `python validate_data.py`로 재현 여부 확인",
              ].join("\n"),
            });
