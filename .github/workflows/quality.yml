name: Quality

on:
  pull_request:
    paths-ignore: ["data.js", "current.json", "docs/**"]
  push:
    branches: [main, "claude/**"]
    paths-ignore: ["data.js", "current.json", "docs/**"]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check spac_hunter tests fetch_data.py validate_data.py
      - name: Test
        run: python -m pytest -q

  js-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JS tests
        run: node --test tests/js
